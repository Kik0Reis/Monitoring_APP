services:

  backend:
    build:
      context: ./backend
    container_name: monitoring-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
    container_name: monitoring-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    restart: unless-stopped


  app-mqtt:
    build:
      context: ./backend

    container_name: monitoring-app-subscriber

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    command:
      - python
      - manage.py
      - mqtt_subscriber

    restart: unless-stopped
