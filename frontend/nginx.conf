server {
    listen 80;
    server_name _;

    #login
    auth_basic "Monitoring Server";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Frontend: React Router does client-side routing, so any path that
    # isn't a real static file must fall back to index.html, or a page
    # refresh on e.g. /dashboard/cameras/3 would 404.
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite-built assets are content-hashed (e.g. index-a1b2c3.js), so it's
    # safe to cache them aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything below is reverse-proxied to Gunicorn, on the internal
    # docker-compose network ("backend" = service name in
    # docker-compose.prod.yml, resolved by Docker's internal DNS).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin's own CSS/JS, collected by `collectstatic` and served
    # by WhiteNoise from inside the Gunicorn process.
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }
}
