services:

  # One-off task: applies pending Django migrations and then exits. The
  # three long-running services below all wait for this to finish
  # successfully before starting, so migrations never race against each
  # other (SQLite in particular does not like concurrent writers).
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: monitoring-migrate

    env_file:
      - ./backend/.env.prod

    environment:
      - SQLITE_PATH=/data/db.sqlite3

    volumes:
      - sqlite-data:/data

    command:
      - python
      - manage.py
      - migrate
      - --noinput

    restart: "no"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: monitoring-backend

    # No "ports:" here on purpose. Gunicorn is only reachable from other
    # containers on this compose network (the "frontend" service talks
    # to it as http://backend:8000) -- it is never exposed to the host.

    env_file:
      - ./backend/.env.prod

    environment:
      - SQLITE_PATH=/data/db.sqlite3
      # The Settings page (core/env_settings.py) reads/writes whatever
      # file this points at. Bind-mounting the real .env.prod here (not
      # baking it into the image) means an edit made through the
      # Settings page lands in the actual file docker-compose reads on
      # the host -- without this, .env.prod never even exists inside the
      # container's filesystem (see backend/.dockerignore), so the
      # Settings page would read/write an empty, throwaway file instead.
      - MONITORING_ENV_FILE=/app/.env.prod

    # backend, app-mqtt, heartbeat and migrate all mount this SAME named
    # volume at the SAME path, so they all read/write the one db.sqlite3
    # file. Without this, each container gets its own private copy and
    # writes in one are invisible to the others.
    volumes:
      - sqlite-data:/data
      - ./backend/.env.prod:/app/.env.prod

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: always


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: monitoring-frontend

    # host_port:container_port. Nginx inside this container listens on
    # 80 (see nginx.conf) -- the container side must be 80, not 8000.
    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: always


  app-mqtt:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: monitoring-app-subscriber

    env_file:
      - ./backend/.env.prod

    environment:
      - SQLITE_PATH=/data/db.sqlite3

    volumes:
      - sqlite-data:/data

    command:
      - python
      - manage.py
      - mqtt_subscriber

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: always


  heartbeat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: monitoring-heartbeat

    env_file:
      - ./backend/.env.prod

    environment:
      - SQLITE_PATH=/data/db.sqlite3

    volumes:
      - sqlite-data:/data

    command:
      - python
      - manage.py
      - heartbeat_worker
      - --timeout
      - "60"
      - --interval
      - "10"

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: always

# Named volume managed by Docker -- keeps the database across
# `docker compose down`/`up` and rebuilds. Only removed with
# `docker compose -f docker-compose.prod.yml down -v`.
volumes:
  sqlite-data: